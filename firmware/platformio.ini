; Claude Atom - firmware do M5Stack AtomS3 como painel fisico do Claude Code.
;   pio run -t upload      (de dentro desta pasta)

[env:atoms3]
platform = espressif32@7.1.3
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified@0.2.26
  bblanchon/ArduinoJson@7.4.3
